<div>
  <h1>{{titulo}}</h1>
<div>
  <button (click)="onConectarDesconectar($event)">{{ corrienteVivienda ? 'Desconectar' : 'Conectar' }} corriente vivienda</button>
</div>
<div class="boton-leyenda">
  <span>Corriente vivienda: {{ this.corrienteVivienda ? 'CONECTADA' : 'DESCONECTADA' }}</span>
</div>
<div>
  <button (click)="onConectarDesconectarHabitacion()">{{ corrienteHabitacion ? 'Desconectar' : 'Conectar' }} corriente Hab #1</button>
</div>
<div class="boton-leyenda">
  <span>Estado recibido: PERSIANA {{ estadoPersiana }}</span>
</div>
</div>
<app-habitacion
  [corriente]="corrienteVivienda && corrienteHabitacion"
  (estadoPersianaChange)="onEstadoPersianaChange($event)">
</app-habitacion>
