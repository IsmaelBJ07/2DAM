<!DOCTYPE html>
<html lang="es">

<!--
        Pregunta 0
    
    Fuentes seguras (safe fonts): son las que ya vienen instaladas en casi todos los ordenadores (como Arial o Georgia). 
    Se usan porque no hay que descargarlas, cargan rápido y se ven igual en cualquier ordenador o navegador.
    
    Fuentes web (como Google Fonts o una alojada en el servidor): no vienen instaladas, se descargan al entrar en la página. 
    Se usan cuando queremos un diseño más original, aunque tardan un poco más en cargar.

-->

<head>
    <meta charset="UTF-8">
    <!--Enlace de Google Fonts de "Pacífico"-->
    <link href="https://fonts.googleapis.com/css2?family=Pacifico" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <section>
        <h2>Nombre</h2>
        <p class="georgia">Ismael Belhach Jiménez</p>
    </section>
    <section>
        <h2>Curso</h2>
        <p class="arial">2º DAM</p>
    </section>
    <section>
        <h2>Clase</h2>
        <p class="courier">Diseño de Interfaces Web</p>
    </section>
    <section>
        <h2>Fuente servidor</h2>
        <p class="poppins">Fuente del servidor (woff)</p>
    </section>
    <section>
        <h2>Link Google Font</h2>
        <p class="pacifico">Google Font con link</p>
    </section>
</body>

</html>
